<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="#334155" stroke-width="4" />

  <!-- QR Code Finder Pattern Top-Left -->
  <rect x="96" y="96" width="104" height="104" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="20" />
  <rect x="128" y="128" width="40" height="40" rx="10" fill="#ffffff" />

  <!-- QR Code Finder Pattern Top-Right -->
  <rect x="312" y="96" width="104" height="104" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="20" />
  <rect x="344" y="128" width="40" height="40" rx="10" fill="#ffffff" />

  <!-- QR Code Finder Pattern Bottom-Left -->
  <rect x="96" y="312" width="104" height="104" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="20" />
  <rect x="128" y="344" width="40" height="40" rx="10" fill="#ffffff" />

  <!-- QR Data modules / stylized dots -->
  <rect x="236" y="96" width="40" height="40" rx="10" fill="#60a5fa" />
  <rect x="236" y="160" width="40" height="40" rx="10" fill="#818cf8" />
  <rect x="96" y="236" width="40" height="40" rx="10" fill="#a78bfa" />
  <rect x="160" y="236" width="40" height="40" rx="10" fill="#60a5fa" />

  <!-- Center Decorative Diamond & Spark -->
  <circle cx="256" cy="256" r="28" fill="url(#accentGrad)" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" />

  <rect x="312" y="236" width="40" height="40" rx="10" fill="#60a5fa" />
  <rect x="376" y="236" width="40" height="40" rx="10" fill="#818cf8" />
  <rect x="236" y="312" width="40" height="40" rx="10" fill="#a78bfa" />
  <rect x="236" y="376" width="40" height="40" rx="10" fill="#60a5fa" />

  <!-- Bottom Right Matrix Cluster -->
  <rect x="312" y="312" width="40" height="40" rx="10" fill="#818cf8" />
  <rect x="376" y="312" width="40" height="40" rx="10" fill="#a78bfa" />
  <rect x="312" y="376" width="40" height="40" rx="10" fill="#60a5fa" />
  <rect x="376" y="376" width="40" height="40" rx="10" fill="#38bdf8" />
</svg>
